name: Build Android Widget APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Widget APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Bundle Schedule Asset
        run: |
          mkdir -p android/app/src/main/assets
          cp src/data/schedule.json android/app/src/main/assets/schedule.json

      - name: Build Debug APK
        run: |
          cd android
          gradle assembleDebug --stacktrace --no-daemon

      - name: Prepare APK Artifact
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/StudyRoom-Widget.apk
          echo "APK successfully built: $(ls -lh output/StudyRoom-Widget.apk)"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyRoom-Widget-APK
          path: output/StudyRoom-Widget.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: widget-apk-latest
          name: "Виджет расписания Android (v1.1.0 · ПОНБ-УП-304С)"
          body: |
            ### Нативный виджет расписания для Android (Версия 1.1.0)
            * **Группа:** ПОНБ-УП-304С (Институт права УУНиТ)
            * **Обновление v1.1.0:**
              * 🚀 Полная оптимизация стабильности для **Samsung One UI** и **Xiaomi MIUI/HyperOS**: фоновый процесс больше не усыпляется системой (`goAsync()`).
              * ⚡ Мгновенное обновление виджета при разблокировке экрана смартфона (`USER_PRESENT`) и смене суток (`DATE_CHANGED`).
              * 📅 Динамический оффлайн-расчет учебной недели (1–17) по календарю без риска зависания на старой неделе.
              * 📦 Встроенная локальная база расписания (работает сразу после установки без ожидания интернета).
              * 🔋 В карточке настроек приложения добавлена быстрая кнопка отключения ограничений батареи.
            * **Функции:**
              * Автоматическое определение дня и текущей пары по времени Уфы (UTC+5).
              * Отображение номера пары, времени, названия предмета, преподавателя и аудитории.
              * Подсветка статуса «СЕЙЧАС».
              * Кнопка мгновенного обновления прямо с домашнего экрана.
              * Прямой переход в веб-кабинет по нажатию.
            
            **Прямая ссылка для скачивания и обновления:**
            📲 [StudyRoom-Widget.apk](https://github.com/${{ github.repository }}/releases/download/widget-apk-latest/StudyRoom-Widget.apk)
          files: output/StudyRoom-Widget.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
