name: Build Android Widget APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Widget APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Bundle Schedule Asset
        run: |
          mkdir -p android/app/src/main/assets
          cp src/data/schedule.json android/app/src/main/assets/schedule.json

      - name: Build Debug APK
        run: |
          cd android
          gradle assembleDebug --stacktrace --no-daemon

      - name: Prepare APK Artifact
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/StudyRoom-Widget.apk
          echo "APK successfully built: $(ls -lh output/StudyRoom-Widget.apk)"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyRoom-Widget-APK
          path: output/StudyRoom-Widget.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: widget-apk-latest
          name: "Виджет расписания Android (v1.2.0 · ПОНБ-УП-304С)"
          body: |
            ### Нативный виджет расписания для Android (Версия 1.2.0)
            * **Группа:** ПОНБ-УП-304С (Институт права УУНиТ)
            * **Обновление v1.2.0 (Режим белых списков & VPN):**
              * 🌐 **Поддержка белых списков и VPN:** добавлено 6 Anycast CDN-зеркал (jsDelivr, GCore, Fastly, GitHub Pages), работающих в РФ при ограничениях.
              * 🔗 **Мгновенная синхронизация из браузера:** если сайт открыт через VPN в Chrome/браузере, расписание передаётся в виджет в 1 клик через `studyroom://sync`.
              * 📱 **Встроенный веб-кабинет с автосинхронизацией:** в приложении добавлен просмотр кабинета через WebView, который автоматически обновляет виджет через системный VPN.
              * 🛡️ **Network Security Config:** поддержка локальных и корпоративных сертификатов/прокси без ошибок TLS.
              * 🚀 **Samsung One UI & Xiaomi HyperOS:** фоновый процесс защищен от усыпления (`goAsync()`), виджет обновляется при разблокировке экрана (`USER_PRESENT`).
              * 📅 **100% Оффлайн-работа:** локальная база данных пар и автоматический календарный расчет недели семестра (1–17).
            * **Функции:**
              * Автоматическое определение дня и текущей пары по времени Уфы (UTC+5).
              * Отображение номера пары, времени, названия предмета, преподавателя и аудитории.
              * Подсветка статуса «СЕЙЧАС».
              * Кнопка мгновенного обновления прямо с домашнего экрана.
              * Прямой переход в веб-кабинет по нажатию.
            
            **Прямая ссылка для скачивания и обновления:**
            📲 [StudyRoom-Widget.apk](https://github.com/${{ github.repository }}/releases/download/widget-apk-latest/StudyRoom-Widget.apk)
          files: output/StudyRoom-Widget.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
