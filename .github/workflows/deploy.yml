name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  schedule:
    # 19:00 UTC = 00:00 в Уфе (UTC+5, Asia/Yekaterinburg)
    - cron: '0 19 * * *'
    # 01:00 UTC = 06:00 в Уфе (утренняя проверка перед парами)
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: High-speed sync with ISU UUNiT (Schedule & Announcements)
        env:
          ISU_LOGIN: ${{ secrets.ISU_LOGIN }}
          ISU_PASSWORD: ${{ secrets.ISU_PASSWORD }}
        run: |
          python3 scripts/sync_uust_schedule.py --force
          if ! git diff --quiet src/data/schedule.json src/data/announcements.json public/data/; then
            echo "Обнаружены изменения в расписании или объявлениях. Фиксация в репозитории..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/data/schedule.json src/data/announcements.json public/data/
            git commit -m "chore(sync): синхронизация расписания и объявлений из ИСУ УУНиТ [skip ci]"
            git push origin main
          else
            echo "Данные расписания и объявлений актуальны."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck & build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
